name: Release create-kongly-docs

on:
  push:
    tags:
      - "create-kongly-docs@v*"

jobs:
  publish:
    name: Stage publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # trusted publishing requires Node >= 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing + staging
        run: npm install -g npm@latest # need >= 11.15.0 for `npm stage publish`

      - name: Install dependencies
        run: bun install

      - name: Verify tag matches package version
        working-directory: packages/create-kongly-docs
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#create-kongly-docs@v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Typecheck
        working-directory: packages/create-kongly-docs
        run: bun run typecheck

      - name: Build
        working-directory: packages/create-kongly-docs
        run: bun run build

      - name: Stage publish to npm
        working-directory: packages/create-kongly-docs
        # OIDC trusted publishing — no NODE_AUTH_TOKEN. Stages the version;
        # a maintainer approves it with 2FA via npmjs.com or `npm stage`.
        run: npm stage publish --provenance --access public
